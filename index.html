<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Historia de Panamá</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        
        :root {
            --panama-blue: #00247d;
            --panama-red: #da121a;
        }

        body, html { 
            font-family: 'Inter', sans-serif; 
            margin: 0; padding: 0;
            background-color: #f8fafc;
            height: 100%; width: 100%;
            overflow: hidden;
            display: flex; flex-direction: column;
        }

        #app {
            width: 100%; max-width: 500px;
            height: 100%; margin: 0 auto;
            background: white; display: flex; flex-direction: column;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }

        .chat-area {
            flex: 1; overflow-y: auto;
            padding: 16px; background-color: #ffffff;
            -webkit-overflow-scrolling: touch;
        }

        .bubble {
            max-width: 88%; padding: 12px 16px;
            border-radius: 20px; font-size: 14px;
            line-height: 1.5; margin-bottom: 12px;
            position: relative;
        }

        .bubble-user {
            background-color: var(--panama-blue); color: white;
            border-bottom-right-radius: 4px; align-self: flex-end;
            margin-left: auto;
        }

        .bubble-ai {
            background-color: #f1f5f9; color: #1e293b;
            border-bottom-left-radius: 4px; 
            align-self: flex-start;
            border: 1px solid #e2e8f0;
        }

        /* AJUSTE PARA TINYHOST: Elevamos la barra de entrada */
        footer {
            padding: 12px 12px calc(60px + env(safe-area-inset-bottom)); /* Aumentado de 16px a 60px para evitar anuncios */
            background: white; border-top: 1px solid #f1f5f9;
        }

        input { font-size: 16px !important; }

        .typing span {
            height: 6px; width: 6px; background: #94a3b8;
            display: inline-block; border-radius: 50%;
            margin: 0 2px; animation: bounce 1.3s infinite;
        }
        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-4px); }
        }
    </style>
</head>
<body>

    <div id="app">
        <!-- Header -->
        <header class="bg-[#00247d] text-white px-5 py-4 pt-10 shadow-sm border-b-4 border-[#da121a] flex justify-between items-center shrink-0">
            <div class="flex items-center gap-3">
                <div class="bg-white/10 p-2 rounded-lg">
                    <i data-lucide="book-open" class="w-5 h-5 text-[#ffcf00]"></i>
                </div>
                <div>
                    <h1 class="font-bold text-sm uppercase tracking-tight">Crónicas de Panamá</h1>
                    <p class="text-[9px] text-blue-200 font-bold opacity-80">ASISTENTE EDUCATIVO</p>
                </div>
            </div>
            <div class="flex gap-1.5">
                <div class="w-2 h-2 bg-white rounded-full"></div>
                <div class="w-2 h-2 bg-[#da121a] rounded-full"></div>
            </div>
        </header>

        <!-- Chat -->
        <div id="chat-box" class="chat-area flex flex-col">
            <div class="bubble bubble-ai">
                ¡Hola! Soy tu asistente de Historia Panameña. 🇵🇦<br><br>
                ¿En qué puedo ayudarte hoy? Podemos hablar sobre la época colonial, la unión a Colombia o la era del Canal.
            </div>
        </div>

        <!-- Cargando -->
        <div id="loading" class="hidden px-6 py-2">
            <div class="typing flex items-center">
                <span class="mr-1"></span><span></span><span></span>
                <span class="text-[10px] text-slate-400 font-bold ml-3 uppercase">Historiador pensando...</span>
            </div>
        </div>

        <!-- Sugerencias -->
        <div class="flex gap-2 overflow-x-auto px-4 py-3 bg-white no-scrollbar shrink-0">
            <button onclick="quickAsk('¿Qué pasó el 3 de noviembre de 1903?')" class="whitespace-nowrap px-4 py-2 bg-slate-50 border border-slate-200 rounded-full text-[11px] font-semibold text-slate-600 active:bg-blue-50">Separación 1903</button>
            <button onclick="quickAsk('Historia de la construcción del Canal')" class="whitespace-nowrap px-4 py-2 bg-slate-50 border border-slate-200 rounded-full text-[11px] font-semibold text-slate-600 active:bg-blue-50">El Canal</button>
            <button onclick="quickAsk('¿Quién fue Justo Arosemena?')" class="whitespace-nowrap px-4 py-2 bg-slate-50 border border-slate-200 rounded-full text-[11px] font-semibold text-slate-600 active:bg-blue-50">J. Arosemena</button>
        </div>

        <!-- Input -->
        <footer class="shrink-0">
            <div class="flex gap-2 items-center bg-slate-100 rounded-2xl p-1 border border-slate-200">
                <input type="text" id="user-input" placeholder="Escribe tu pregunta..." class="flex-1 bg-transparent px-4 py-3 outline-none text-sm">
                <button onclick="sendMessage()" class="bg-[#00247d] text-white p-3 rounded-xl active:scale-95 shadow-md">
                    <i data-lucide="send-horizontal" class="w-5 h-5"></i>
                </button>
            </div>
        </footer>
    </div>

    <script>
        lucide.createIcons();
        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const loading = document.getElementById('loading');
        const apiKey = ""; 

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            userInput.blur();
            userInput.value = '';
            addMessage('user', text);
            loading.classList.remove('hidden');
            
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: text }] }],
                        systemInstruction: { parts: [{ text: "Eres un historiador experto en Panamá. Responde de forma breve, pedagógica y apasionada sobre la historia patria de Panamá. No respondas temas ajenos a Panamá." }] }
                    })
                });
                const data = await response.json();
                addMessage('assistant', data.candidates[0].content.parts[0].text);
            } catch (e) {
                addMessage('assistant', "Lo siento, tuve un problema al conectar con mis archivos históricos.");
            } finally {
                loading.classList.add('hidden');
            }
        }

        function addMessage(role, text) {
            const div = document.createElement('div');
            div.className = `bubble ${role === 'user' ? 'bubble-user' : 'bubble-ai'}`;
            div.innerHTML = text.replace(/\n/g, '<br>').replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
            chatBox.appendChild(div);
            
            setTimeout(() => {
                chatBox.scrollTo({ top: chatBox.scrollHeight, behavior: 'smooth' });
            }, 100);
        }

        function quickAsk(topic) { userInput.value = topic; sendMessage(); }
        userInput.addEventListener('keypress', (e) => { if(e.key === 'Enter') sendMessage(); });

        function setHeight() {
            document.getElementById('app').style.height = window.innerHeight + "px";
        }
        window.addEventListener('resize', setHeight);
        setHeight();
    </script>
</body>
</html>
