<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Crónicas de Panamá</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        
        :root {
            --panama-blue: #00247d;
            --panama-red: #da121a;
        }

        body, html { 
            font-family: 'Inter', sans-serif; 
            margin: 0; padding: 0;
            background-color: #f1f5f9;
            height: 100%; width: 100%;
            overflow: hidden;
            display: flex; flex-direction: column;
        }

        #app {
            width: 100%; max-width: 500px;
            height: 100%; margin: 0 auto;
            background: white; display: flex; flex-direction: column;
            position: relative;
        }

        .chat-area {
            flex: 1; overflow-y: auto;
            padding: 16px; background-color: #ffffff;
            background-image: radial-gradient(#e2e8f0 0.5px, transparent 0.5px);
            background-size: 20px 20px;
            -webkit-overflow-scrolling: touch;
        }

        .bubble {
            max-width: 85%; padding: 12px 16px;
            border-radius: 20px; font-size: 14px;
            line-height: 1.5; margin-bottom: 12px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        .bubble-user {
            background-color: var(--panama-blue); color: white;
            border-bottom-right-radius: 4px; align-self: flex-end;
            margin-left: auto;
        }

        .bubble-ai {
            background-color: #f8fafc; color: #1e293b;
            border-bottom-left-radius: 4px; 
            align-self: flex-start;
            border: 1px solid #e2e8f0;
            border-left: 4px solid var(--panama-red);
        }

        footer {
            padding: 12px 12px calc(20px + env(safe-area-inset-bottom));
            background: white; 
            border-top: 1px solid #e2e8f0;
            z-index: 10;
        }

        input { font-size: 16px !important; }

        .typing span {
            height: 5px; width: 5px; background: var(--panama-blue);
            display: inline-block; border-radius: 50%;
            margin: 0 1px; animation: bounce 1.3s infinite;
        }
        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-4px); }
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>

    <div id="app">
        <header class="bg-[#00247d] text-white px-5 py-4 pt-10 shadow-lg border-b-4 border-[#da121a] flex justify-between items-center shrink-0">
            <div class="flex items-center gap-3">
                <i data-lucide="landmark" class="w-6 h-6 text-[#ffcf00]"></i>
                <div>
                    <h1 class="font-bold text-sm uppercase tracking-tighter">Historia de Panamá</h1>
                    <p class="text-[8px] text-blue-200 font-bold opacity-90">ASISTENTE EDUCATIVO</p>
                </div>
            </div>
        </header>

        <div id="chat-box" class="chat-area flex flex-col">
            <div class="bubble bubble-ai">
                ¡Hola! Soy tu guía para aprender sobre Panamá. 🇵🇦<br><br>
                Pregúntame sobre la <b>Independencia</b>, el <b>Canal</b> o nuestros próceres.
            </div>
        </div>

        <div id="loading" class="hidden px-6 py-2 bg-white">
            <div class="typing flex items-center">
                <span class="mr-1"></span><span></span><span></span>
                <span class="text-[9px] text-slate-400 font-bold ml-3 uppercase tracking-widest">Consultando archivos...</span>
            </div>
        </div>

        <div class="flex gap-2 overflow-x-auto px-4 py-3 bg-slate-50 no-scrollbar shrink-0 border-t border-slate-100">
            <button onclick="quickAsk('¿Qué pasó el 3 de noviembre de 1903?')" class="whitespace-nowrap px-4 py-2 bg-white border border-slate-200 rounded-full text-[11px] font-bold text-slate-700 shadow-sm active:bg-blue-50">Separación 1903</button>
            <button onclick="quickAsk('Historia del Canal de Panamá')" class="whitespace-nowrap px-4 py-2 bg-white border border-slate-200 rounded-full text-[11px] font-bold text-slate-700 shadow-sm active:bg-blue-50">El Canal</button>
            <button onclick="quickAsk('¿Quién fue Victoriano Lorenzo?')" class="whitespace-nowrap px-4 py-2 bg-white border border-slate-200 rounded-full text-[11px] font-bold text-slate-700 shadow-sm active:bg-blue-50">V. Lorenzo</button>
        </div>

        <footer class="shrink-0">
            <div class="flex gap-2 items-center bg-slate-100 rounded-2xl p-1.5 border border-slate-200">
                <input type="text" id="user-input" placeholder="Escribe aquí..." class="flex-1 bg-transparent px-3 py-2 outline-none text-sm">
                <button id="send-btn" onclick="sendMessage()" class="bg-[#00247d] text-white p-3 rounded-xl active:scale-95 shadow-md transition-all">
                    <i data-lucide="send-horizontal" class="w-5 h-5"></i>
                </button>
            </div>
        </footer>
    </div>

    <script>
        lucide.createIcons();
        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const loading = document.getElementById('loading');
        
        // API Key de Ney
        const apiKey = "AIzaSyADZMhSls9jz5FiGcrosZnKsPyUfKZrN3Q"; 

        const systemPrompt = "Eres un historiador experto en Panamá. Responde siempre de forma breve (máximo 2 párrafos), usando un lenguaje pedagógico para estudiantes panameños. Solo habla de temas relacionados con la historia de Panamá. Si te preguntan algo ajeno, responde amablemente que tu conocimiento se limita a la historia patria de Panamá.";

        async function fetchAIResponse(text) {
            // Cambio clave: se añadió "-latest" al modelo y se mantuvo v1beta que es la más flexible
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash-latest:generateContent?key=${apiKey}`;
            
            const payload = {
                contents: [{ 
                    role: "user",
                    parts: [{ text: systemPrompt + "\n\nPregunta del estudiante: " + text }] 
                }]
            };

            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await response.json();

            if (!response.ok) {
                console.error("ERROR EN CONSOLA:", data);
                throw new Error(data.error?.message || "Error");
            }

            return data;
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            userInput.blur();
            userInput.value = '';
            addMessage('user', text);
            loading.classList.remove('hidden');
            
            try {
                const data = await fetchAIResponse(text);
                const aiResponse = data.candidates?.[0]?.content?.parts?.[0]?.text || "No tengo datos sobre eso.";
                addMessage('assistant', aiResponse);
            } catch (e) {
                addMessage('assistant', "Hubo un problema al consultar la historia. Detalle: " + e.message);
            } finally {
                loading.classList.add('hidden');
            }
        }

        function addMessage(role, text) {
            const div = document.createElement('div');
            div.className = `bubble ${role === 'user' ? 'bubble-user' : 'bubble-ai'}`;
            div.innerHTML = text.replace(/\n/g, '<br>').replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
            chatBox.appendChild(div);
            
            setTimeout(() => {
                chatBox.scrollTo({ top: chatBox.scrollHeight, behavior: 'smooth' });
            }, 100);
        }

        function quickAsk(topic) { userInput.value = topic; sendMessage(); }
        userInput.addEventListener('keypress', (e) => { if(e.key === 'Enter') sendMessage(); });

        function setHeight() {
            document.getElementById('app').style.height = window.innerHeight + "px";
        }
        window.addEventListener('resize', setHeight);
        setHeight();
    </script>
</body>
</html>
